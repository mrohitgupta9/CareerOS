name: Deployment Validation

on:
  workflow_run:
    workflows:
      - CD
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  validate-release:

    name: Validate Docker Release
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull frontend image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/productionsetup-frontend:latest

      - name: Pull backend image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/productionsetup-backend:latest

      - name: Verify frontend image
        run: |
          docker image inspect \
            ghcr.io/${{ github.repository_owner }}/productionsetup-frontend:latest

      - name: Verify backend image
        run: |
          docker image inspect \
            ghcr.io/${{ github.repository_owner }}/productionsetup-backend:latest

      - name: Deployment validation
        run: |
          echo "Docker release validated successfully."
          echo "Images are available in GHCR."